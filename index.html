<!-- we like speed -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mikuuu!</title>
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Null-Austin/pb-assets@main/fa.css"> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Null-Austin/pb-assets@main/ShagLounge.css">
    <style>
      body,html,#main{
        margin: 0; 
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: "Shag Lounge", serif;
      }
      body{
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgb(106, 106, 216);
      }
      #main{
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        width: 100%;
        height: max-content;
        margin: 0 auto;
        /*background-color: rgb(255, 46, 46);*/
        text-align: center;
        justify-content: center;
        align-items: center;
      }
      #main>*{
        margin: 0;
        padding: 0;
      }
      #header{
        font-size: 10rem;
        color: white;
        margin-bottom: 0.5rem;
      }
      #header i{
        transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        cursor: pointer;
        display: inline-block;
      }
      #header i:hover{
        transform: scale(1.1);
      }
      #header i.pop-left{
        animation: popAnimationLeft 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }
      #header i.pop-right{
        animation: popAnimationRight 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }
      @keyframes popAnimationLeft {
        0% { transform: scale(1); }
        50% { transform: scale(1.3) rotate(-15deg); }
        100% { transform: scale(1); }
      }
      @keyframes popAnimationRight {
        0% { transform: scale(1); }
        50% { transform: scale(1.3) rotate(15deg); }
        100% { transform: scale(1); }
      }
      #sub-header{
        font-size: 2rem;
        color: rgb(24, 24, 24);
      }
      a{
        color: rgb(8, 117, 145);
        text-decoration: none;
      }
      img {
        transform: translateX(4.25vw);
        width: 25vw;
        aspect-ratio: 1 / 1;
        margin: 0 auto;
      }
      h2{
        font-size: 3rem
      }
      a{
        color: rgb(26, 26, 26);
      }
    </style>
  </head>
  <body>
    <div id="main">
      <img src="https://m.media-amazon.com/images/I/71jjCeykfQL._AC_UF894,1000_QL80_.jpg" alt="">

      <h2><a href="https://www.youtube.com/@hayloanimtrack">Hatsune Miku</a></h2>

      <img src="https://bananapedia.wiki.gg/images/thumb/BR_Miku.png/300px-BR_Miku.png?b6d838" alt="">
    </div>
  </body>
</html>
